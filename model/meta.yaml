# Agent registry metadata
#
# model/ is the AGENT REGISTRY, and nothing else. The enterprise business and IT
# model lives in app/data/ and is generated by app/tools/generate_seed.py; this
# directory holds only what that generator cannot know: one Agent Operating
# Manifest per agent, the runtimes they execute on, and the controls they are
# held to. `python3 app/tools/generate_seed.py` projects all of it into the graph.
schemaVersion: "1.0.0"
organization: "Animal Health — AI Center of Excellence"
asOf: "2026-09-10"

# Every record carries a confidence marker. Nothing here has been confirmed
# against the real estate yet, so it all ships as `seed`.
#   seed      — illustrative placeholder authored by the CoE, NOT verified
#   declared  — asserted by the owning team, not yet evidenced
#   evidenced — backed by telemetry, a config export, or a signed manifest
confidenceLevels: [seed, declared, evidenced]

disclaimer: >
  The five agents in model/agents/ are SEED RECORDS. They encode the shape of the
  inventory, not its contents. Replace every field marked `confidence: seed` with
  values taken from the delivered agents before this is shown outside the CoE.
