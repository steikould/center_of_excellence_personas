# Level 2/3 — Systems of record. These are the enterprise applications the
# business processes run on and the agents integrate with. Fields mirror
# knowledge-base/_schema/platform-entry.schema.md so entries can round-trip.
systems:
  - id: sys-argus
    name: Oracle Argus Safety
    category: Safety
    vendor: Oracle
    hosting: on-prem
    owner: Safety Systems
    confidence: seed
    purpose: "Global pharmacovigilance case management and E2B submission engine."
    dataClassification: restricted
    gxpRelevant: true
    part11: true
    validationStatus: validated
    auditTrail: enabled
    aiReadiness: constrained
    aiReadinessNote: "Vendor-hosted schema; integration only via supported web services. No direct DB access permitted under validation."
    interfaces: [soap, e2b-gateway, db-view]

  - id: sys-labware
    name: LabWare LIMS
    category: LIMS
    vendor: LabWare
    hosting: on-prem
    owner: Quality Systems
    confidence: seed
    purpose: "Laboratory sample lifecycle, testing, results and specifications across QC labs."
    dataClassification: restricted
    gxpRelevant: true
    part11: true
    validationStatus: validated
    auditTrail: enabled
    aiReadiness: ready
    aiReadinessNote: "REST API exposed via internal gateway; read-only service account approved for analytics."
    interfaces: [rest, sql, file-drop]

  - id: sys-mes
    name: Manufacturing Execution System
    category: MES
    vendor: Siemens Opcenter
    hosting: on-prem
    owner: Manufacturing IT
    confidence: seed
