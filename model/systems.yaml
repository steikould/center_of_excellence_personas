    dataClassification: restricted
    gxpRelevant: true
    part11: true
    validationStatus: validated
    auditTrail: enabled
    aiReadiness: constrained
    aiReadinessNote: "Site-local instances, no unified API. Requires per-site integration and site change control."
    interfaces: [rest, file-drop]

  - id: sys-sap
    name: SAP S/4HANA
    category: ERP
    vendor: SAP
    hosting: private-cloud
    owner: Enterprise Applications
