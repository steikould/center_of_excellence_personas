# Integration topology. Edges in the graph-of-operations: what moves between
# systems and agents. Mirrors knowledge-base/_schema/connection-pattern.schema.md.
# `kind`: data | control | telemetry
flows:
  # --- business data flows
  - { id: fl-mail-pv,      from: sys-m365,        to: agt-pv-intake,      kind: data, label: "Intake mailbox",              frequency: event-driven, criticality: critical, gxpInTransit: true,  protocol: "Graph API" }
  - { id: fl-snow-pv,      from: sys-servicenow,  to: agt-pv-intake,      kind: data, label: "Field safety reports",        frequency: event-driven, criticality: high,     gxpInTransit: true,  protocol: "REST" }
  - { id: fl-pv-argus,     from: agt-pv-intake,   to: sys-argus,          kind: data, label: "Draft case create/update",    frequency: event-driven, criticality: critical, gxpInTransit: true,  protocol: "SOAP via MCP" }
  - { id: fl-vault-pv,     from: sys-veeva-vault, to: agt-pv-intake,      kind: data, label: "Reference safety information", frequency: on-demand,    criticality: high,     gxpInTransit: true,  protocol: "Vault REST" }
  - { id: fl-argus-gw,     from: sys-argus,       to: sys-gateway,        kind: data, label: "E2B(R3) submission",          frequency: event-driven, criticality: critical, gxpInTransit: true,  protocol: "AS2" }

  - { id: fl-mes-br,       from: sys-mes,         to: agt-batch-review,   kind: data, label: "Executed batch record",       frequency: event-driven, criticality: critical, gxpInTransit: true,  protocol: "REST, per site" }
  - { id: fl-lims-br,      from: sys-labware,     to: agt-batch-review,   kind: data, label: "Results & specifications",    frequency: event-driven, criticality: critical, gxpInTransit: true,  protocol: "REST" }
  - { id: fl-docu-br,      from: sys-documentum,  to: agt-batch-review,   kind: data, label: "Legacy attachments (degraded)", frequency: on-demand,  criticality: medium,   gxpInTransit: true,  protocol: "File drop", health: degraded, note: "OCR failures cause silent skips" }
  - { id: fl-br-tw,        from: agt-batch-review,to: sys-trackwise,      kind: data, label: "Draft deviation",             frequency: event-driven, criticality: high,     gxpInTransit: true,  protocol: "REST via MCP" }
  - { id: fl-br-sap,       from: agt-batch-review,to: sys-sap,            kind: data, label: "Review outcome (read-back)",   frequency: event-driven, criticality: high,     gxpInTransit: true,  protocol: "OData" }

  - { id: fl-vault-reg,    from: sys-veeva-vault, to: agt-reg-assembly,   kind: data, label: "Approved source documents",   frequency: on-demand,    criticality: critical, gxpInTransit: true,  protocol: "Vault REST" }
  - { id: fl-reg-rim,      from: agt-reg-assembly,to: sys-veeva-rim,      kind: data, label: "Assembled dossier",           frequency: on-demand,    criticality: critical, gxpInTransit: true,  protocol: "Vault REST" }
  - { id: fl-rim-gw,       from: sys-veeva-rim,   to: sys-gateway,        kind: data, label: "Authority transmission",      frequency: on-demand,    criticality: critical, gxpInTransit: true,  protocol: "AS2", note: "Human-authorised. No agent principal." }

  - { id: fl-sap-ncr,      from: sys-sap,         to: agt-supplier-triage,kind: data, label: "Incoming material NCR",       frequency: event-driven, criticality: high,     gxpInTransit: true,  protocol: "OData" }
  - { id: fl-ncr-tw,       from: agt-supplier-triage, to: sys-trackwise,  kind: data, label: "Draft NCR & supplier CAPA",   frequency: event-driven, criticality: high,     gxpInTransit: true,  protocol: "REST" }
  - { id: fl-mes-ncr,      from: sys-mes,         to: agt-supplier-triage,kind: data, label: "Batch genealogy",             frequency: on-demand,    criticality: high,     gxpInTransit: true,  protocol: "REST" }

  - { id: fl-sf-mi,        from: sys-salesforce,  to: agt-medinfo,        kind: data, label: "Inbound inquiry",             frequency: real-time,    criticality: high,     gxpInTransit: false, protocol: "Platform events" }
  - { id: fl-vault-mi,     from: sys-veeva-vault, to: agt-medinfo,        kind: data, label: "Standard response library",   frequency: daily,        criticality: high,     gxpInTransit: false, protocol: "SharePoint mirror" }
  - { id: fl-mi-sf,        from: agt-medinfo,     to: sys-salesforce,     kind: data, label: "Answer & case log",           frequency: real-time,    criticality: high,     gxpInTransit: false, protocol: "REST" }
  - { id: fl-mi-pv,        from: agt-medinfo,     to: agt-pv-intake,      kind: control, label: "Suspected AE handoff",     frequency: event-driven, criticality: critical, gxpInTransit: true,  protocol: "REST", note: "Regulatory clock starts here." }

  # --- telemetry flows (the federated pipeline)
  - { id: fl-tel-azure,    from: rt-agentos-azure,   to: cp-otel, kind: telemetry, label: "Redacted OTLP spans",        frequency: streaming, criticality: medium, gxpInTransit: false, protocol: "OTLP/gRPC" }
  - { id: fl-tel-copilot,  from: rt-copilot-studio,  to: cp-otel, kind: telemetry, label: "App Insights → OTLP bridge", frequency: streaming, criticality: medium, gxpInTransit: false, protocol: "OTLP/HTTP" }
  - { id: fl-tel-dify,     from: rt-dify-onprem,     to: cp-otel, kind: telemetry, label: "Langfuse collector export",  frequency: streaming, criticality: medium, gxpInTransit: false, protocol: "OTLP/gRPC" }
  - { id: fl-tel-wh,       from: cp-otel,            to: cp-warehouse, kind: telemetry, label: "Conformed runs",        frequency: streaming, criticality: medium, gxpInTransit: false, protocol: "Native ingest" }
  - { id: fl-eval-back,    from: cp-eval,            to: cp-warehouse, kind: telemetry, label: "Evaluation scores",     frequency: daily,     criticality: medium, gxpInTransit: false, protocol: "OTLP/HTTP" }
  - { id: fl-atlas,        from: cp-warehouse,       to: cp-atlas, kind: telemetry, label: "Atlas metrics query",       frequency: on-demand, criticality: low,    gxpInTransit: false, protocol: "KQL over REST" }
