# Level 1/2 — Business capabilities and the process steps inside them.
# A capability belongs to one domain. A process step is the unit an agent
# actually operates on, and is where business meets IT: each step names the
# systems it touches and the agent (if any) that now performs it.
#
# step.mode:
#   human      — performed by a person
#   agent      — performed by an agent, no routine human gate
#   agent+hitl — performed by an agent, human approves before the step commits
#   system     — automated by conventional (non-AI) integration
capabilities:
  # ---------------------------------------------------------------- SAFETY
  - id: cap-ae-intake
    domain: dom-safety
    name: Adverse Event Intake & Triage
    confidence: seed
    summary: "Receive an event from any channel, deduplicate it, decide if it is a valid case, and classify seriousness and expectedness."
    annualVolume: 48000
    volumeUnit: events
    priorFte: 11.0
    currentFte: 7.5
    processes:
      - id: proc-ae-receive
        name: Receive & normalise inbound event
        mode: agent
        agent: agt-pv-intake
        systems: [sys-argus, sys-servicenow, sys-m365]
        description: "Pull from mailbox, call-centre feed, distributor portal and literature feed; normalise to E2B-ish intermediate."
        cycleTimeBefore: 240
        cycleTimeAfter: 8
        cycleUnit: minutes
      - id: proc-ae-dedupe
        name: Duplicate detection against case history
        mode: agent
        agent: agt-pv-intake
        systems: [sys-argus]
        description: "Fuzzy match on animal, product, reporter, event window."
        cycleTimeBefore: 35
        cycleTimeAfter: 2
        cycleUnit: minutes
      - id: proc-ae-validity
        name: Four-element validity determination
        mode: agent+hitl
        agent: agt-pv-intake
        systems: [sys-argus]
        description: "Identifiable reporter, identifiable animal, suspect product, adverse event. Agent proposes; safety physician confirms."
        cycleTimeBefore: 45
        cycleTimeAfter: 12
        cycleUnit: minutes
      - id: proc-ae-serious
        name: Seriousness & expectedness classification
        mode: agent+hitl
        agent: agt-pv-intake
        systems: [sys-argus, sys-veeva-vault]
        description: "Classify against reference safety information. Drives the 15-day clock."
        cycleTimeBefore: 60
        cycleTimeAfter: 15
        cycleUnit: minutes
      - id: proc-ae-narrative
        name: Case narrative authoring
        mode: agent+hitl
        agent: agt-pv-intake
        systems: [sys-argus]
        description: "Draft the regulatory narrative from structured fields and source text."
        cycleTimeBefore: 90
        cycleTimeAfter: 20
        cycleUnit: minutes
      - id: proc-ae-medreview
        name: Medical assessment & causality
        mode: human
        systems: [sys-argus]
        description: "Retained by qualified safety physician. Explicitly out of scope for automation."
        cycleTimeBefore: 120
        cycleTimeAfter: 120
        cycleUnit: minutes

  - id: cap-ae-report
    domain: dom-safety
    name: Regulatory Safety Reporting
    confidence: seed
    summary: "Convert an assessed case into the submissions each authority requires, on their clock."
    annualVolume: 19000
    volumeUnit: submissions
    priorFte: 6.0
    currentFte: 5.0
    processes:
      - id: proc-ae-e2b
        name: E2B(R3) generation & schema validation
        mode: system
        systems: [sys-argus]
        cycleTimeBefore: 20
        cycleTimeAfter: 5
        cycleUnit: minutes
      - id: proc-ae-gateway
        name: Gateway transmission & ACK reconciliation
        mode: system
        systems: [sys-argus, sys-gateway]
        cycleTimeBefore: 30
        cycleTimeAfter: 10
        cycleUnit: minutes
      - id: proc-ae-psur
        name: Periodic safety report assembly
        mode: human
        systems: [sys-argus, sys-veeva-vault]
        cycleTimeBefore: 4800
        cycleTimeAfter: 4800
        cycleUnit: minutes

  # --------------------------------------------------------------- QUALITY
  - id: cap-batch-review
    domain: dom-quality
    name: Batch Record Review & Disposition
    confidence: seed
    summary: "Review the executed batch record for completeness and conformance, resolve exceptions, and disposition the lot."
    annualVolume: 5200
    volumeUnit: batches
    priorFte: 18.0
    currentFte: 11.0
    processes:
      - id: proc-br-collect
        name: Assemble executed record & attachments
        mode: system
        systems: [sys-mes, sys-labware, sys-documentum]
        cycleTimeBefore: 180
        cycleTimeAfter: 15
        cycleUnit: minutes
      - id: proc-br-completeness
        name: Completeness & data-integrity check
        mode: agent
        agent: agt-batch-review
        systems: [sys-mes, sys-labware]
        description: "Every required entry present, signed, in-window, ALCOA+ attributes intact."
        cycleTimeBefore: 210
        cycleTimeAfter: 12
        cycleUnit: minutes
      - id: proc-br-spec
        name: Result-to-specification conformance
        mode: agent
        agent: agt-batch-review
        systems: [sys-labware, sys-sap]
        description: "Compare every in-process and release result to the registered specification."
        cycleTimeBefore: 150
        cycleTimeAfter: 8
        cycleUnit: minutes
      - id: proc-br-exception
        name: Exception classification & routing
        mode: agent+hitl
        agent: agt-batch-review
        systems: [sys-trackwise, sys-mes]
        description: "Agent classifies the exception and drafts the deviation; QA reviewer accepts or overrides."
        cycleTimeBefore: 240
        cycleTimeAfter: 45
        cycleUnit: minutes
      - id: proc-br-disposition
        name: Lot disposition decision
        mode: human
        systems: [sys-sap, sys-trackwise]
        description: "Qualified Person / designated QA signatory. Never delegated to an agent."
        cycleTimeBefore: 60
        cycleTimeAfter: 60
        cycleUnit: minutes

  - id: cap-capa
    domain: dom-quality
    name: Deviation & CAPA Management
    confidence: seed
    summary: "Investigate deviations, determine root cause, and drive corrective and preventive actions to closure."
    annualVolume: 2900
    volumeUnit: records
    priorFte: 9.0
    currentFte: 8.0
    processes:
      - id: proc-capa-intake
        name: Deviation intake & initial classification
        mode: agent+hitl
        agent: agt-batch-review
        systems: [sys-trackwise]
        cycleTimeBefore: 90
        cycleTimeAfter: 20
        cycleUnit: minutes
      - id: proc-capa-rca
        name: Root cause investigation
        mode: human
        systems: [sys-trackwise]
        cycleTimeBefore: 2400
        cycleTimeAfter: 2400
        cycleUnit: minutes
      - id: proc-capa-effectiveness
        name: Effectiveness check scheduling & evidence pull
        mode: system
        systems: [sys-trackwise, sys-labware]
        cycleTimeBefore: 120
        cycleTimeAfter: 20
        cycleUnit: minutes

  # ------------------------------------------------------------ REGULATORY
  - id: cap-submission
    domain: dom-regulatory
    name: Submission Assembly & Publishing
    confidence: seed
    summary: "Turn approved source documents into a validated, market-specific dossier and file it."
    annualVolume: 640
    volumeUnit: submissions
    priorFte: 12.0
    currentFte: 7.0
    processes:
      - id: proc-sub-plan
        name: Dossier plan & gap analysis
        mode: agent+hitl
        agent: agt-reg-assembly
        systems: [sys-veeva-rim]
        description: "Derive required sections per market; identify missing or expiring source documents."
        cycleTimeBefore: 960
        cycleTimeAfter: 120
        cycleUnit: minutes
      - id: proc-sub-assemble
        name: Document collection & eCTD/VNeeS assembly
        mode: agent
        agent: agt-reg-assembly
        systems: [sys-veeva-vault, sys-veeva-rim]
        cycleTimeBefore: 2400
        cycleTimeAfter: 180
        cycleUnit: minutes
      - id: proc-sub-validate
        name: Technical validation & remediation
        mode: agent
        agent: agt-reg-assembly
        systems: [sys-veeva-rim]
        description: "Run market validation rules, auto-remediate mechanical failures, escalate substantive ones."
        cycleTimeBefore: 720
        cycleTimeAfter: 60
        cycleUnit: minutes
      - id: proc-sub-qc
        name: Regulatory QC review
        mode: human
        systems: [sys-veeva-rim]
        cycleTimeBefore: 480
        cycleTimeAfter: 300
        cycleUnit: minutes
      - id: proc-sub-file
        name: Authority transmission
        mode: system
        systems: [sys-veeva-rim, sys-gateway]
        cycleTimeBefore: 60
        cycleTimeAfter: 30
        cycleUnit: minutes

  # ---------------------------------------------------------------- SUPPLY
  - id: cap-supplier-quality
    domain: dom-supply
    name: Supplier Quality & Nonconformance
    confidence: seed
    summary: "Qualify and monitor suppliers; triage incoming-material nonconformances and drive supplier CAPA."
    annualVolume: 3400
    volumeUnit: NCRs
    priorFte: 8.0
    currentFte: 5.5
    processes:
      - id: proc-ncr-intake
        name: NCR intake & severity triage
        mode: agent
        agent: agt-supplier-triage
        systems: [sys-sap, sys-trackwise]
        cycleTimeBefore: 120
        cycleTimeAfter: 10
        cycleUnit: minutes
      - id: proc-ncr-impact
        name: Lot & batch impact assessment
        mode: agent+hitl
        agent: agt-supplier-triage
        systems: [sys-sap, sys-mes, sys-labware]
        description: "Trace the affected material into every batch that consumed it."
        cycleTimeBefore: 300
        cycleTimeAfter: 35
        cycleUnit: minutes
      - id: proc-ncr-supplier
        name: Supplier notification & CAPA request
        mode: agent+hitl
        agent: agt-supplier-triage
        systems: [sys-sap, sys-m365]
        cycleTimeBefore: 90
        cycleTimeAfter: 20
        cycleUnit: minutes
      - id: proc-ncr-qualify
        name: Supplier requalification decision
        mode: human
        systems: [sys-trackwise]
        cycleTimeBefore: 480
        cycleTimeAfter: 480
        cycleUnit: minutes

  # ------------------------------------------------------------ COMMERCIAL
  - id: cap-medinfo
    domain: dom-commercial
    name: Veterinary Medical Information
    confidence: seed
    summary: "Answer unsolicited product questions from veterinarians and producers, within approved label, and log the interaction."
    annualVolume: 71000
    volumeUnit: inquiries
    priorFte: 14.0
    currentFte: 6.0
    processes:
      - id: proc-mi-intake
        name: Inquiry capture & intent classification
        mode: agent
        agent: agt-medinfo
        systems: [sys-salesforce, sys-m365]
        cycleTimeBefore: 15
        cycleTimeAfter: 1
        cycleUnit: minutes
      - id: proc-mi-answer
        name: Standard response retrieval & composition
        mode: agent
        agent: agt-medinfo
        systems: [sys-veeva-vault, sys-salesforce]
        description: "Answer strictly from the approved standard-response library and label. Refuses to compose outside it."
        cycleTimeBefore: 45
        cycleTimeAfter: 2
        cycleUnit: minutes
      - id: proc-mi-escalate
        name: Off-library escalation to medical information specialist
        mode: agent+hitl
        agent: agt-medinfo
        systems: [sys-salesforce]
        description: "Anything not answerable from the library is handed to a person with the assembled context."
        cycleTimeBefore: 60
        cycleTimeAfter: 30
        cycleUnit: minutes
      - id: proc-mi-ae
        name: Adverse event detection & handoff to safety
        mode: agent
        agent: agt-medinfo
        systems: [sys-salesforce, sys-argus]
        description: "Any inquiry containing a possible adverse event is forwarded to PV intake within the regulatory clock."
        cycleTimeBefore: 30
        cycleTimeAfter: 1
        cycleUnit: minutes
      - id: proc-mi-author
        name: New standard response authoring & approval
        mode: human
        systems: [sys-veeva-vault]
        cycleTimeBefore: 1200
        cycleTimeAfter: 1200
        cycleUnit: minutes
